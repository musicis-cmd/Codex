# Frammento da aggiungere al server HTTPS ESISTENTE di www.musicis.it.
# Non sostituisce la configurazione completa del dominio.
location = /mercato-usato {
    return 301 /mercato-usato/;
}

location ^~ /mercato-usato/ {
    client_max_body_size 55m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Un solo proxy fidato: sovrascrivere gli header ricevuti dal client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Non creare un alias statico per uploads/: anche le foto attraversano Node,
# che verifica lo stato dell'annuncio e la sessione amministratore.
